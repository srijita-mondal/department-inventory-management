{% extends 'base.html' %}{% block content %}<section class="panel"><p class="eyebrow">CHECK-OUT</p><h1>Issue an item</h1><form method="post" class="form-grid"><label>Registered student *<select name="student_id" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.id }}">{{ s.name }} · {{ s.enrolment_number }}</option>{% endfor %}</select></label><label>Inventory item *<select name="item_id" required>{% for i in items %}<option value="{{ i.id }}">{{ i.name }} ({{ i.code }}) — {{ available_quantity(i) }} available · {{ i.tracking_type }}</option>{% endfor %}</select></label><label>Quantity *<input name="quantity" type="number" min="1" value="1" required></label><label>Issue date *<input name="issue_date" type="date" value="{{ today.isoformat() }}" required></label><label>Asset ID (for individual assets)<select name="asset_id"><option value="">Select asset if applicable</option>{% for a in assets %}<option value="{{ a.id }}">{{ a.asset_tag }} — {{ a.item.name }}</option>{% endfor %}</select></label><label>Purpose<input name="purpose" placeholder="Lab work, project, etc."></label><div class="full notice">Due date is automatically set to 15 calendar days after the issue date.</div><div class="full"><button>Confirm issue</button></div></form></section>{% endblock %}

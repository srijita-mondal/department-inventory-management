{% extends 'base.html' %}{% block content %}<p class="eyebrow">STORAGE</p><h1>Storage locations</h1><section class="panel"><form method="post" class="form-grid"><label>Location name *<input name="name" placeholder="For example: Lab 2, Cupboard A" required></label><label>Description<input name="description"></label><div class="full"><button>Add location</button></div></form></section><div class="table-wrap"><table><tr><th>Location</th><th>Description</th></tr>{% for l in locations %}<tr><td>{{ l.name }}</td><td>{{ l.description }}</td></tr>{% else %}<tr><td colspan="2">No locations created yet.</td></tr>{% endfor %}</table></div>{% endblock %}

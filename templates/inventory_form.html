{% extends 'base.html' %}{% block content %}<section class="panel"><p class="eyebrow">CATALOGUE MANAGEMENT</p><h1>Add inventory item</h1><form method="post" class="form-grid"><label>Item code *<input name="code" required></label><label>Item name *<input name="name" required></label><label>Category<input name="category"></label><label>Make / model<input name="make_model"></label><label>Tracking type<select name="tracking_type"><option value="quantity">Quantity-based (cables, adapters)</option><option value="asset">Individual assets (boards, laptops)</option></select></label><label>Total quantity *<input name="total_quantity" type="number" min="0" value="1" required></label><label>Storage location<select name="location_id"><option value="">Not assigned</option>{% for l in locations %}<option value="{{ l.id }}">{{ l.name }}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="3"></textarea></label><label class="full">Asset tags (only for individual assets; one unique tag per line)<textarea name="asset_tags" rows="4" placeholder="DB-014&#10;DB-015"></textarea></label><div class="full"><button>Create item</button> <a class="button secondary" href="{{ url_for('inventory') }}">Cancel</a></div></form></section>{% endblock %}
